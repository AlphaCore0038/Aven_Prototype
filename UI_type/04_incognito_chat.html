<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Incognito Chat</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#151515',
            panelBg: '#1e1e1e',
            dimText: '#9a9a99',
            cardBorder: 'rgba(255, 255, 255, 0.08)',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom styling for dashed container and cursor animation -->
<style data-purpose="custom-layout">
    /* Subtle blinking cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: blink 1.1s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    
    /* Subtle custom dash styling matching iOS app screenshots */
    .dashed-prompt-box {
      border: 1px dashed rgba(255, 255, 255, 0.14);
      background-color: #1b1b1b;
    }
  </style>
</head>
<body class="bg-appBg text-white font-sans antialiased m-0 p-0 flex justify-center items-center min-h-screen select-none overflow-hidden">
<!-- BEGIN: MobileContainer -->
<!-- Container scaled for standard mobile view ratio matching 778x1600 -->
<main class="w-full max-w-[430px] h-[100dvh] flex flex-col justify-between px-4 pt-3 pb-6 relative overflow-hidden bg-appBg">
<!-- BEGIN: TopNavigationBar -->
<header class="flex items-center justify-between w-full pt-2 px-1 text-neutral-400">
<!-- Left: Hamburger Menu Button -->
<button aria-label="Open menu" class="p-2 text-neutral-300 hover:text-white transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-width="1.8" viewbox="0 0 24 24">
<line x1="4" x2="16" y1="7" y2="7"></line>
<line x1="4" x2="20" y1="12" y2="12"></line>
<line x1="4" x2="11" y1="17" y2="17"></line>
</svg>
</button>
<!-- Center: Screen Title -->
<h1 class="text-[17px] font-normal tracking-tight text-neutral-400">
        Incognito chat
      </h1>
<!-- Right: Close 'X' Button -->
<button aria-label="Close" class="p-2 text-neutral-300 hover:text-white transition-colors focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<line x1="6" x2="18" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="18" y2="6"></line>
</svg>
</button>
</header>
<!-- END: TopNavigationBar -->
<!-- BEGIN: CenterContent -->
<section class="flex flex-col items-center justify-center text-center px-4 -mt-10" data-purpose="incognito-info">
<!-- Mascot / Ghost Icon -->
<div class="mb-6 flex justify-center items-center">
<svg class="w-[46px] h-[46px] text-white fill-current" viewbox="0 0 48 48">
<!-- Ghost Body with two hollow eyes -->
<path clip-rule="evenodd" d="M24 6C15.7157 6 9 12.7157 9 21V38.5C9 39.8807 10.1193 41 11.5 41C12.4414 41 13.2652 40.4784 13.6874 39.7121L16.2 35.1585L18.7126 39.7121C19.2435 40.6744 20.3703 41.1711 21.4362 40.9168C22.5021 40.6625 23.2798 39.7139 23.3204 38.6186L23.4079 36.2576L24.5921 36.2576L24.6796 38.6186C24.7202 39.7139 25.4979 40.6625 26.5638 40.9168C27.6297 41.1711 28.7565 40.6744 29.2874 39.7121L31.8 35.1585L34.3126 39.7121C34.7348 40.4784 35.5586 41 36.5 41C37.8807 41 39 39.8807 39 38.5V21C39 12.7157 32.2843 6 24 6ZM18 20C19.1046 20 20 19.1046 20 18C20 16.8954 19.1046 16 18 16C16.8954 16 16 16.8954 16 18C16 19.1046 16.8954 20 18 20ZM30 20C31.1046 20 32 19.1046 32 18C32 16.8954 31.1046 16 30 16C28.8954 16 28 16.8954 28 18C28 19.1046 28.8954 20 30 20Z" fill-rule="evenodd"></path>
</svg>
</div>
<!-- Description headline -->
<p class="text-[17.5px] leading-[1.38] text-neutral-300 font-normal max-w-[310px] tracking-tight">
        Incognito chats stay out of your history and search, and aren’t used to train
      </p>
<!-- Learn more link -->
<a class="mt-4 text-[16px] text-neutral-400 underline underline-offset-4 decoration-neutral-500 hover:text-neutral-200 transition-colors" href="#">
        Learn more
      </a>
</section>
<!-- END: CenterContent -->
<!-- BEGIN: BottomChatCard -->
<div class="w-full dashed-prompt-box rounded-[28px] p-4 flex flex-col justify-between h-[154px] shadow-2xl relative" data-purpose="chat-box-container">
<!-- Top Text Entry Row with Cursor -->
<div class="flex items-center pt-1.5 px-0.5 select-text">
<span class="inline-block w-[1.5px] h-[21px] bg-neutral-400 mr-[1px] blinking-cursor rounded-full"></span>
<span class="text-[18px] text-neutral-400 font-normal tracking-tight ml-[1px]">Chat with</span>
</div>
<!-- Bottom Actions Toolbar -->
<div class="flex items-center justify-between w-full pt-2">
<!-- Plus Button -->
<button aria-label="Attach file or action" class="w-10 h-10 rounded-full bg-[#272727] flex items-center justify-center text-neutral-300 hover:bg-[#323232] transition-colors focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="12" x2="12" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="12" y2="12"></line>
</svg>
</button>
<!-- Centered Pill Placeholder (empty pill button) -->
<div class="flex-1 mx-3 h-10 bg-[#252525] rounded-full opacity-60"></div>
<!-- Right Side Buttons: Mic and Audio Waveform -->
<div class="flex items-center space-x-2">
<!-- Microphone Button -->
<button aria-label="Use voice input" class="w-10 h-10 rounded-full bg-[#272727] flex items-center justify-center text-neutral-300 hover:bg-[#323232] transition-colors focus:outline-none" type="button">
<svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="11" rx="3" width="6" x="9" y="3"></rect>
<path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
<line x1="12" x2="12" y1="18" y2="22"></line>
<line x1="8" x2="16" y1="22" y2="22"></line>
</svg>
</button>
<!-- Voice / Sound Waveform Button (Filled White Circle) -->
<button aria-label="Start voice chat" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-black hover:bg-neutral-200 transition-colors shadow focus:outline-none" type="button">
<!-- Audio Spectrum / Waveform Bars -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<rect height="6" rx="0.9" width="1.8" x="4" y="9"></rect>
<rect height="12" rx="0.9" width="1.8" x="8" y="6"></rect>
<rect height="16" rx="0.9" width="1.8" x="12" y="4"></rect>
<rect height="10" rx="0.9" width="1.8" x="16" y="7"></rect>
<rect height="4" rx="0.9" width="1.8" x="20" y="10"></rect>
</svg>
</button>
</div>
</div>
</div>
<!-- END: BottomChatCard -->
</main>
<!-- END: MobileContainer -->
</body></html>
