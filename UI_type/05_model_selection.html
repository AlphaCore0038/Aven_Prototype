<!DOCTYPE html><html lang="en" style=""><head></head><body class="text-white font-sans flex justify-center"><svg class="inline-defs-container" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Model Selection</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#121212',
            sheetDark: '#191919',
            rowDark: '#212121',
            brandCoral: '#c97a5b',
            accentBlue: '#5383ec',
            badgeBg: 'rgba(56, 92, 148, 0.45)',
            badgeText: '#9bbef2',
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Prevent bouncing and handle mobile frame */
    html, body {
      background-color: #0d0d0d;
      height: 100%;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #131313;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .sheet-shadow {
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.65);
    }
  </style>


<!-- BEGIN: MobileFrame -->
<div class="mobile-frame w-full shadow-2xl relative select-none">
<!-- BEGIN: TopBar -->
<header class="pt-4 px-5 flex items-center justify-between z-10" data-purpose="top-navigation-bar">
<!-- Hamburger Menu Button -->
<button aria-label="Menu" class="text-[#8e8e8e] hover:text-white transition-colors focus:outline-none p-1" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<line stroke-linecap="round" x1="3.5" x2="20.5" y1="6" y2="6"></line>
<line stroke-linecap="round" x1="3.5" x2="16" y1="12" y2="12"></line>
<line stroke-linecap="round" x1="3.5" x2="11.5" y1="18" y2="18"></line>
</svg>
</button>
<!-- Ghost / Mascot Outline Icon -->
<button aria-label="Profile or Character" class="text-[#8e8e8e] hover:text-white transition-colors focus:outline-none p-1" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<!-- Ghost/character shaped path -->
<path d="M12 3a7.5 7.5 0 0 0-7.5 7.5c0 4.2 0 7.8 0 8.5 0 .5.3.8.8.8.8 0 1.2-.5 1.7-1 .6-.6 1.4-.9 2.2-.9s1.6.3 2.2.9c.7.7 1.3 1 2.1 1s1.4-.3 2.1-1c.6-.6 1.4-.9 2.2-.9s1.6.3 2.2.9c.5.5.9 1 1.7 1 .5 0 .8-.3.8-.8 0-.7 0-4.3 0-8.5A7.5 7.5 0 0 0 12 3z"></path>
<!-- Ghost eyes -->
<circle cx="9.5" cy="10" fill="currentColor" r="0.9"></circle>
<circle cx="14.5" cy="10" fill="currentColor" r="0.9"></circle>
</svg>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: CenterGreetingSection -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center" data-purpose="center-greeting" style="filter: blur(2.5px); transform: scale(1.35); transform-origin: center center;" data-stitch-orig-opacity="0.6">  <!-- Brand Monogram Logo -->
  <div class="mb-4 flex items-center justify-center">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_M_gTOV16mG-5XvXTZBbpkIPMNjQpvAMxV2yAT6aAkZQHcULBe29jugofuADprefWK3YBADk-39iHuBJorp2PFK0iet2SryJ0HHDFP6CphMKh6BF_rZB4SmmiUaxeJf6iRTHVH7nJ1uWf2MZvGjBa6URSuaBFk6gB8omtzTFnpElvHnuLbCAOcsH7Tq0uil33LAZdcSu30RMVE1Zrc55JpLxu-1LgJKSTsuASGvJzycT5xgwTSUPNB936Kna5advX1BU" alt="Logo" style="width: 96px; height: 96px; mix-blend-mode: screen; filter: drop-shadow(rgba(255, 255, 255, 0.05) 0px 0px 1px); background: transparent; display: block; object-fit: contain;" class="">
  </div>
  <!-- Serif Greeting Text -->
  </main>
<!-- END: CenterGreetingSection -->
<!-- BEGIN: ModelSelectorBottomSheet -->
<section class="bg-sheetDark rounded-t-[32px] pt-4 pb-2 px-3 sheet-shadow z-20" data-purpose="model-bottom-sheet">
<!-- Modal Header (Close button & Title) -->
<div class="relative flex items-center justify-center pb-5 pt-1 px-3">
<!-- Close icon on top-left -->
<button aria-label="Close" class="absolute left-3 p-1 text-[#b5b5b5] hover:text-white transition-colors focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<line stroke-linecap="round" x1="6" x2="18" y1="6" y2="18"></line>
<line stroke-linecap="round" x1="6" x2="18" y1="18" y2="6"></line>
</svg>
</button>
<!-- Title -->
<h2 class="text-[17px] font-semibold text-white tracking-tight">
          Select model
        </h2>
</div>
<!-- Models List Card Container -->
<div class="bg-rowDark rounded-2xl overflow-hidden divide-y divide-[#2a2a2a]/80" data-purpose="models-list">
<!-- Model Item 1: Fable 5.1 -->
<button class="w-full text-left px-4 py-3.5 flex flex-col justify-center hover:bg-[#282828] active:bg-[#282828] transition-colors focus:outline-none" type="button">
<div class="flex items-center space-x-2">
<span class="text-[16px] font-normal text-white">Fable 5.1</span>
<span class="bg-badgeBg text-badgeText text-[11px] font-medium px-2 py-0.5 rounded-full inline-flex items-center">
              Pro or Max
            </span>
</div>
<span class="text-[13px] text-[#868686] mt-0.5 tracking-tight font-normal">
            For your toughest challenges
          </span>
</button>
<!-- Model Item 2: Opus 5.5 -->
<button class="w-full text-left px-4 py-3.5 flex flex-col justify-center hover:bg-[#282828] active:bg-[#282828] transition-colors focus:outline-none" type="button">
<div class="flex items-center space-x-2">
<span class="text-[16px] font-normal text-white">Opus 5.5</span>
<span class="bg-badgeBg text-badgeText text-[11px] font-medium px-2 py-0.5 rounded-full inline-flex items-center">
              Pro
            </span>
</div>
<span class="text-[13px] text-[#868686] mt-0.5 tracking-tight font-normal">
            For complex work and everyday tasks
          </span>
</button>
<!-- Model Item 3: Sonnet 5.5 (Active/Selected) -->
<button class="w-full text-left px-4 py-3.5 flex items-center justify-between hover:bg-[#282828] active:bg-[#282828] transition-colors focus:outline-none" type="button">
<div class="flex flex-col justify-center">
<span class="text-[16px] font-normal text-white">Sonnet 5.5</span>
<span class="text-[13px] text-[#868686] mt-0.5 tracking-tight font-normal">
              Most efficient for simpler tasks
            </span>
</div>
<!-- Selected Checkmark Icon -->
<div class="text-[#5586f1] pr-2">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"></polyline>
</svg>
</div>
</button>
<!-- Model Item 4: Haiku 4.5 -->
<button class="w-full text-left px-4 py-3.5 flex flex-col justify-center hover:bg-[#282828] active:bg-[#282828] transition-colors focus:outline-none" type="button">
<span class="text-[16px] font-normal text-white">Haiku 4.5</span>
<span class="text-[13px] text-[#868686] mt-0.5 tracking-tight font-normal">
            Fastest for quick answers
          </span>
</button>
</div>
<!-- END: Models List Card Container -->
<!-- BEGIN: NavigationBarIndicator -->
<footer class="w-full flex justify-center pt-5 pb-2" data-purpose="home-indicator-container">
<!-- iOS / Modern Android bottom gesture indicator pill -->
<div class="w-36 h-[4.5px] bg-[#d5d5d5] rounded-full opacity-80"></div>
</footer>
<!-- END: NavigationBarIndicator -->
</section>
<!-- END: ModelSelectorBottomSheet -->
</div>
<!-- END: MobileFrame -->
















</body></html>
